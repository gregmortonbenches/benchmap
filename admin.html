<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Bench Map UK — Photo Moderation</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
      background: #f5f7f5;
      color: #1a2e1a;
      line-height: 1.5;
    }
    .header {
      padding: 16px 24px;
      background: #1a2e1a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { margin: 0; font-size: 1.1rem; font-weight: 700; }
    .header a { color: #a8c5a8; text-decoration: none; font-size: 0.9rem; }
    .header a:hover { color: #fff; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
    .auth-panel {
      max-width: 420px;
      margin: 48px auto;
      padding: 32px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .auth-panel h2 { margin-top: 0; font-size: 1.2rem; }
    .auth-panel p { color: #555; font-size: 0.9rem; }
    button {
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      padding: 10px 18px;
      transition: background 0.15s ease;
    }
    .btn-primary { background: #388E3C; color: #fff; }
    .btn-primary:hover { background: #2e6b32; }
    .btn-secondary { background: #eee; color: #333; }
    .btn-secondary:hover { background: #ddd; }
    .btn-approve { background: #388E3C; color: #fff; }
    .btn-approve:hover { background: #2e6b32; }
    .btn-reject { background: #b32d2d; color: #fff; }
    .btn-reject:hover { background: #8f2222; }
    .summary {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .summary h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
    .summary .count {
      background: #388E3C;
      color: #fff;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .photo-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
    }
    .photo-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #eef0ee;
      display: block;
      cursor: zoom-in;
    }
    .photo-meta {
      padding: 12px;
      font-size: 0.82rem;
      color: #555;
      flex: 1;
    }
    .photo-meta .bench-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      color: #333;
      word-break: break-all;
      margin-bottom: 4px;
    }
    .photo-meta .when { color: #888; }
    .photo-meta a { color: #388E3C; text-decoration: none; font-weight: 600; }
    .photo-actions {
      padding: 0 12px 12px;
      display: flex;
      gap: 8px;
    }
    .photo-actions button { flex: 1; padding: 8px; font-size: 0.85rem; }
    .empty {
      padding: 48px 16px;
      text-align: center;
      color: #888;
      background: #fff;
      border-radius: 12px;
    }
    .error {
      background: #fdecea;
      color: #b32d2d;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 4px; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      padding: 8px 16px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }
    .tab.active {
      background: #1a2e1a;
      color: #fff;
      border-color: #1a2e1a;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Photo moderation</h1>
    <a href="index.html">← Back to map</a>
  </header>

  <main>
    <div id="authPanel" class="auth-panel" style="display:none">
      <h2>Sign in to moderate</h2>
      <p>Only allow-listed admin accounts can approve or reject photos.</p>
      <button id="signInBtn" class="btn-primary">Sign in with Google</button>
      <p id="authError" class="error" style="display:none"></p>
    </div>

    <div id="adminPanel" style="display:none">
      <div class="summary">
        <div>
          <h2 id="signedInAs"></h2>
          <button id="signOutBtn" class="btn-secondary" style="margin-top:8px">Sign out</button>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" data-status="pending" role="tab">Pending</button>
        <button class="tab" data-status="approved" role="tab">Approved</button>
        <button class="tab" data-status="rejected" role="tab">Rejected</button>
      </div>

      <div class="summary">
        <h2>
          <span id="tabLabel">Pending photos</span>
          <span class="count" id="photoCount">0</span>
        </h2>
        <button id="refreshBtn" class="btn-secondary">Refresh</button>
      </div>

      <div id="photoGrid" class="photo-grid"></div>
    </div>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Bench photo">
    <img id="lightboxImg" src="" alt="" />
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script>
    // ============================================================
    // CONFIGURE: list every email allowed to moderate photos here.
    // Must match the rule in firestore.rules.
    // ============================================================
    const ADMIN_EMAILS = [
      'gregmorton03@gmail.com'
    ];

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAg-VG3laAp8kvel5mC9Q_kWhLv6xvFTPY",
      authDomain: "bench-rating.firebaseapp.com",
      projectId: "bench-rating",
      storageBucket: "bench-rating.firebasestorage.app",
      messagingSenderId: "601862513386",
      appId: "1:601862513386:web:485fa761244ea436a4ad93"
    };

    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    const authPanel  = document.getElementById('authPanel');
    const adminPanel = document.getElementById('adminPanel');
    const signInBtn  = document.getElementById('signInBtn');
    const signOutBtn = document.getElementById('signOutBtn');
    const authError  = document.getElementById('authError');
    const grid       = document.getElementById('photoGrid');
    const photoCount = document.getElementById('photoCount');
    const tabLabel   = document.getElementById('tabLabel');
    const refreshBtn = document.getElementById('refreshBtn');
    const signedInAs = document.getElementById('signedInAs');
    const tabs       = document.querySelectorAll('.tab');
    const lightbox   = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    let currentStatus = 'pending';

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showAuth() {
      authPanel.style.display = 'block';
      adminPanel.style.display = 'none';
    }
    function showAdmin(user) {
      authPanel.style.display = 'none';
      adminPanel.style.display = 'block';
      signedInAs.textContent = 'Signed in as ' + user.email;
    }

    // We track whether the most recent auth state change was a forced sign-out
    // due to a non-admin email, so the rejection banner survives the second
    // onAuthStateChanged callback that signOut() triggers.
    let stickyAuthError = '';

    auth.onAuthStateChanged(function(user) {
      if (!user) {
        if (stickyAuthError) {
          authError.textContent = stickyAuthError;
          authError.style.display = 'block';
          stickyAuthError = '';
        } else {
          authError.style.display = 'none';
        }
        return showAuth();
      }
      if (ADMIN_EMAILS.indexOf(user.email) === -1) {
        stickyAuthError = 'Account ' + user.email + ' is not on the moderator list.';
        auth.signOut();
        return;
      }
      authError.style.display = 'none';
      showAdmin(user);
      loadPhotos();
    });

    signInBtn.addEventListener('click', function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(function(err) {
        authError.textContent = err.message || 'Sign-in failed';
        authError.style.display = 'block';
      });
    });

    signOutBtn.addEventListener('click', function() { auth.signOut(); });
    refreshBtn.addEventListener('click', loadPhotos);

    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        currentStatus = tab.dataset.status;
        tabLabel.textContent = currentStatus.charAt(0).toUpperCase() + currentStatus.slice(1) + ' photos';
        loadPhotos();
      });
    });

    function loadPhotos() {
      grid.innerHTML = '<p style="color:#888">Loading…</p>';
      db.collection('benchPhotos')
        .where('status', '==', currentStatus)
        .get()
        .then(function(snap) {
          const docs = [];
          snap.forEach(function(d) { docs.push({ id: d.id, data: d.data() }); });
          docs.sort(function(a, b) {
            const ta = a.data.createdAt && a.data.createdAt.toMillis ? a.data.createdAt.toMillis() : 0;
            const tb = b.data.createdAt && b.data.createdAt.toMillis ? b.data.createdAt.toMillis() : 0;
            return tb - ta;
          });
          photoCount.textContent = docs.length;
          if (!docs.length) {
            grid.innerHTML = '<div class="empty">No ' + escapeHtml(currentStatus) + ' photos.</div>';
            return;
          }
          grid.innerHTML = docs.map(function(d) {
            const p = d.data;
            const when = p.createdAt && p.createdAt.toDate ? p.createdAt.toDate().toLocaleString() : '—';
            const safeUrl = escapeHtml(p.url || '');
            const safeBenchId = escapeHtml(p.benchId || '');
            const safeId = escapeHtml(d.id);
            let actionsHtml = '';
            if (currentStatus === 'pending') {
              actionsHtml = '<button class="btn-approve" data-id="' + safeId + '" data-action="approve">Approve</button>'
                          + '<button class="btn-reject" data-id="' + safeId + '" data-action="reject">Reject</button>';
            } else if (currentStatus === 'approved') {
              actionsHtml = '<button class="btn-reject" data-id="' + safeId + '" data-action="reject">Unpublish</button>';
            } else {
              actionsHtml = '<button class="btn-approve" data-id="' + safeId + '" data-action="approve">Restore</button>'
                          + '<button class="btn-reject" data-id="' + safeId + '" data-action="delete">Delete</button>';
            }
            return ''
              + '<article class="photo-card">'
              + '  <img src="' + safeUrl + '" alt="Bench photo" loading="lazy" data-full="' + safeUrl + '"/>'
              + '  <div class="photo-meta">'
              + '    <div class="bench-id">' + safeBenchId + '</div>'
              + '    <div class="when">' + escapeHtml(when) + '</div>'
              + '    <div><a href="index.html?bench=' + encodeURIComponent(p.benchId || '') + '" target="_blank" rel="noopener">View on map →</a></div>'
              + '  </div>'
              + '  <div class="photo-actions">' + actionsHtml + '</div>'
              + '</article>';
          }).join('');
        })
        .catch(function(err) {
          console.error(err);
          grid.innerHTML = '<div class="error">Could not load photos: ' + escapeHtml(err.message || err.code || 'unknown error') + '</div>';
        });
    }

    grid.addEventListener('click', function(e) {
      const img = e.target.closest('img[data-full]');
      if (img) {
        lightboxImg.src = img.dataset.full;
        lightbox.classList.add('open');
        return;
      }
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      btn.disabled = true;
      btn.textContent = '…';
      if (action === 'approve') {
        db.collection('benchPhotos').doc(id).update({
          status: 'approved',
          moderatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          moderatedBy: auth.currentUser.email
        }).then(loadPhotos).catch(function(err) { alert('Failed: ' + err.message); btn.disabled = false; });
      } else if (action === 'reject') {
        db.collection('benchPhotos').doc(id).update({
          status: 'rejected',
          moderatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          moderatedBy: auth.currentUser.email
        }).then(loadPhotos).catch(function(err) { alert('Failed: ' + err.message); btn.disabled = false; });
      } else if (action === 'delete') {
        if (!confirm('Permanently delete this photo and its file?')) { btn.disabled = false; btn.textContent = 'Delete'; return; }
        db.collection('benchPhotos').doc(id).get().then(function(doc) {
          const path = doc.data() && doc.data().storagePath;
          const fileDelete = path ? storage.ref().child(path).delete().catch(function(){}) : Promise.resolve();
          return fileDelete.then(function() { return doc.ref.delete(); });
        }).then(loadPhotos).catch(function(err) { alert('Failed: ' + err.message); btn.disabled = false; });
      }
    });

    lightbox.addEventListener('click', function() { lightbox.classList.remove('open'); lightboxImg.src = ''; });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { lightbox.classList.remove('open'); lightboxImg.src = ''; }
    });
  </script>
</body>
</html>
